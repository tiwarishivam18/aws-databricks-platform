name: Check catalog OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    name: Check ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [catalog-dev-plan, catalog-dev-apply]
    environment: ${{ matrix.environment }}

    steps:
      - name: Print AWS trust policy
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))

          policy = {
              "Version": "2012-10-17",
              "Statement": [{
                  "Effect": "Allow",
                  "Principal": {
                      "Federated": "arn:aws:iam::043309323736:oidc-provider/token.actions.githubusercontent.com"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                      "StringEquals": {
                          "token.actions.githubusercontent.com:aud": claims["aud"],
                          "token.actions.githubusercontent.com:sub": claims["sub"]
                      }
                  }
              }]
          }
          print(json.dumps(policy, indent=2))
          PY